<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sliced Portrait</title>
<style>
  /* Tokens: DESIGN.md */
  :root {
    --paper: #ece2cd;
    --paper-bright: #f2ead6;
    --ink: #5c4a34;
    --ink-soft: #6b5a42;
    --ink-faint: #8a7a5e;
    --border: rgba(110,92,64,0.25);
    --border-strong: rgba(110,92,64,0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px; line-height: 1.4;
    background: var(--paper); color: var(--ink-faint);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    height: 61px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--ink); }
  header .sub { font-size: 12px; color: var(--ink-faint); }
  main { flex: 1; display: flex; min-height: 0; }
  #stage {
    flex: 1; min-width: 0; overflow: auto;
    display: flex; align-items: center; justify-content: center; gap: 32px;
    padding: 16px; margin-right: 276px; transition: margin-right .2s;
  }
  #stage.wide { margin-right: 0; }
  #result, #anim { max-width: 100%; max-height: calc(100vh - 61px - 32px); border: 1px solid var(--border); }
  #anim { display: none; }
  body.anim #result { display: none; }
  body.anim #anim { display: block; }
  #panel.busy > :not(.btnrow) { pointer-events: none; opacity: .5; }
  #panel.busy .btnrow > :not(#btnAnim) { pointer-events: none; opacity: .5; }
  /* steps stack in one column next to the result, so the stage never scrolls */
  #stages { display: none; flex: none; flex-direction: column; gap: 12px; justify-content: center; }
  #stages figure { text-align: center; }
  #stages canvas { max-width: 220px; max-height: calc((100vh - 61px - 32px - 3 * 34px) / 3); border: 1px solid var(--border); display: block; margin: 0 auto; }
  #stages figcaption { margin-top: 4px; font-size: 12px; color: var(--ink-faint); }
  body.steps #result, body.steps #anim { max-width: calc(100% - 252px); }
  body.steps #stages { display: flex; }

  #panel {
    position: fixed; top: 61px; right: 0; bottom: 0; width: 276px;
    background: var(--paper); border-left: 1px solid var(--border);
    padding: 12px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
    transition: transform .2s;
  }
  #panel.hidden { transform: translateX(277px); }
  #ptoggle {
    position: fixed; top: 73px; right: 276px; z-index: 3;
    width: 29px; height: 29px; padding: 0;
    border: 1px solid var(--border-strong); border-radius: 4px;
    background: var(--paper); color: var(--ink); cursor: pointer;
    font-size: 15px; line-height: 27px; transition: right .2s;
  }
  #ptoggle.hidden { right: 8px; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow > * { flex: 1; }
  button {
    font-family: inherit; font-size: 12px; color: var(--ink);
    background: transparent; border: 1px solid var(--border-strong); border-radius: 4px;
    padding: 5px 10px; cursor: pointer;
  }
  button.active { background: var(--ink); color: var(--paper-bright); }
  .ctrl label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
  .ctrl .val { color: var(--ink); }
  .ctrl input[type=range] { width: 100%; accent-color: var(--ink); height: 16px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); cursor: pointer; }
  .check input { accent-color: var(--ink); }
  select, input[type=number] {
    font-family: inherit; font-size: 12px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--border-strong); border-radius: 4px; padding: 4px 6px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row label { flex: none; font-size: 12px; color: var(--ink-soft); }
  .row input[type=number] { flex: 1; min-width: 0; -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .hint { font-size: 12px; color: var(--ink-faint); }
  hr { border: none; border-top: 1px solid var(--border); }
  #status { font-size: 12px; color: var(--ink-faint); min-height: 17px; }
</style>
</head>
<body class="steps">
<header>
  <h1>sliced portrait</h1>
  <div class="sub" id="imginfo"></div>
</header>
<main>
  <div id="stage">
    <canvas id="result"></canvas>
    <canvas id="anim" width="1000" height="1000"></canvas>
    <div id="stages"></div>
  </div>
  <div id="panel">
    <div class="btnrow">
      <button id="btnLoad">load</button>
      <button id="btnFlip">flip</button>
      <button id="btnAnim">animate</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>

    <div class="ctrl">
      <label>strips <span class="val" id="stripsOut">20</span></label>
      <input type="range" id="strips" min="10" max="60" value="20">
    </div>
    <label class="check"><input type="checkbox" id="bw" checked> black &amp; white</label>
    <label class="check"><input type="checkbox" id="steps" checked> show steps</label>
    <label class="check"><input type="checkbox" id="loop"> loop animation</label>
    <div class="hint">mirror the portrait into a 2x2 grid, cut it into strips, turn each strip and stack them again. twice. click the original step to flip it.</div>

    <hr>
    <div class="row"><label>export</label>
      <input type="number" id="size" value="1280" min="200" max="4000" step="100" title="long edge in px">
      <select id="fmt"><option value="image/webp">webp</option><option value="image/jpeg">jpeg</option><option value="image/png">png</option></select>
    </div>
    <div class="btnrow" id="sizes"><button>1280</button><button>2048</button><button>4000</button></div>
    <div class="hint">long edge in px · recomputed from the upload, never upscaled</div>
    <button id="download">download</button>
    <div id="status"></div>
  </div>
</main>
<button id="ptoggle" title="show/hide menu">&rsaquo;</button>

<script>
// ponytail: whole thing is one function applied twice, see README for the physical process.
const $ = id => document.getElementById(id);
const PREVIEW = 1400; // longest side of the source for the live view, keeps passes fast on phones

let source = null;      // ImageBitmap or Image
let sourceName = 'warhol.jpg';
let flip = false;       // mirror the source on its vertical axis

function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Step 0: fit + optional grayscale.
function prepare(img, max) {
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = canvas(Math.round(img.width * s), Math.round(img.height * s));
  const ctx = c.getContext('2d');
  if (flip) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, 0, 0, c.width, c.height);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if ($('bw').checked) {
    const d = ctx.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) p[i] = p[i + 1] = p[i + 2] = p[i] * .299 + p[i + 1] * .587 + p[i + 2] * .114;
    ctx.putImageData(d, 0, 0);
  }
  return c;
}

// Step 1: mirror to a 2x2 grid, the four heads meet at the axes. Assumes the source faces right (warhol.jpg does).
function mirror(src) {
  const w = src.width, h = src.height, c = canvas(w * 2, h * 2), ctx = c.getContext('2d');
  for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
    ctx.save();
    ctx.translate(w, sy < 0 ? h * 2 : 0); // original goes right, mirror copy left: faces look outward
    ctx.scale(sx, sy);
    ctx.drawImage(src, 0, 0);
    ctx.restore();
  }
  return c;
}

// Step 2+3: cut n vertical strips, turn each 90 degrees, stack top to bottom,
// taking strips alternately from the left and right edge, moving inwards.
// Strips are taken from the outside in, alternately left and right: 0, n-1, 1, n-2, ...
function stripOrder(n) {
  const order = [];
  for (let k = 0; order.length < n; k++) {
    order.push(k);
    if (n - 1 - k !== k) order.push(n - 1 - k);
  }
  return order;
}
function pass(src, n) {
  const sw = Math.floor(src.width / n), h = src.height;
  const c = canvas(h, sw * n), ctx = c.getContext('2d');
  stripOrder(n).forEach((i, row) => {
    ctx.save();
    ctx.translate(h, row * sw);       // band's top-right corner
    ctx.rotate(Math.PI / 2);          // all strips turned the same way
    ctx.drawImage(src, i * sw, 0, sw, h, 0, 0, sw, h);
    ctx.restore();
  });
  return c;
}

// The whole pipeline. max = longest side the source is scaled to first.
function build(max) {
  const n = +$('strips').value;
  const stages = [['original', prepare(source, max)]];
  stages.push(['mirrored', mirror(stages[0][1])]);
  for (let i = 1; i <= 2; i++) stages.push([`pass ${i}`, pass(stages[stages.length - 1][1], n)]);
  return stages; // the sheet stays as it lands after pass 2, no final turn
}

function render() {
  if (!source) return;
  const stages = build(PREVIEW), final = stages[stages.length - 1][1];
  const out = $('result');
  out.width = final.width; out.height = final.height;
  out.getContext('2d').drawImage(final, 0, 0);
  $('imginfo').textContent = `${sourceName} · ${source.width} x ${source.height} px${flip ? ' · flipped' : ''}`;
  attachOverlays(stages[1][1], out, +$('strips').value);
  $('btnFlip').classList.toggle('active', flip);

  $('stages').replaceChildren(...stages.slice(0, -1).map(([name, c]) => { // last stage is the result on the left
    const f = document.createElement('figure');
    const cap = document.createElement('figcaption');
    cap.textContent = name;
    if (name === 'original') { cap.textContent += ' · click to flip'; c.style.cursor = 'pointer'; c.onclick = toggleFlip; }
    if (c.width > c.height) {           // display only: show landscape stages upright, the data stays as is
      const r = canvas(c.height, c.width), ctx = r.getContext('2d');
      ctx.translate(r.width, 0); ctx.rotate(Math.PI / 2); ctx.drawImage(c, 0, 0);
      c = r;
    }
    f.append(c, cap);
    return f;
  }));
}

function toggleFlip() { flip = !flip; render(); }

// Hover overlays: strip numbers on the mirrored sheet and where they ended up in the result.
// Result columns are pass-1 strips (band r1 lands in column n-1-r1), result rows are pass-2 strips.
function overlay(c, draw) {
  const ctx = c.getContext('2d');
  let saved = null;
  c.onmouseenter = () => { saved = ctx.getImageData(0, 0, c.width, c.height); draw(ctx); };
  c.onmouseleave = () => { if (saved) ctx.putImageData(saved, 0, 0); saved = null; };
}
function label(ctx, text, x, y, size) {
  ctx.font = `600 ${size}px ui-sans-serif, system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size / 5; ctx.strokeStyle = 'rgba(236,226,205,.85)'; ctx.strokeText(text, x, y);
  ctx.fillStyle = 'rgba(92,74,52,.9)'; ctx.fillText(text, x, y);
}
function gridLines(ctx, w, h, cw, ch) {
  ctx.strokeStyle = 'rgba(236,226,205,.6)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = cw; x < w; x += cw) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = ch; y < h; y += ch) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
}
function attachOverlays(mirrored, result, n) {
  const sw1 = Math.floor(mirrored.width / n), order = stripOrder(n);
  overlay(mirrored, ctx => {
    gridLines(ctx, mirrored.width, mirrored.height, sw1, mirrored.height);
    // the step image is small on screen, so the numbers are bigger than a strip and staggered over four rows
    const fs = sw1 * 2;
    for (let i = 0; i < n; i++) label(ctx, i + 1, i * sw1 + sw1 / 2, mirrored.height / 2 + (i % 4 - 1.5) * fs * 1.1, fs);
  });
  const cw = result.width / n, ch = result.height / n, size = Math.min(cw, ch) * .55;
  overlay(result, ctx => {
    gridLines(ctx, result.width, result.height, cw, ch);
    for (let c = 0; c < n; c++) label(ctx, order[n - 1 - c] + 1, c * cw + cw / 2, ch * (c ? .5 : .3), size); // columns: pass-1 strips
    for (let r = 0; r < n; r++) label(ctx, order[r] + 1, cw / 2, r * ch + ch * (r ? .5 : .72), size);         // rows: pass-2 strips, corner cell holds both
  });
}

$('strips').oninput = () => { $('stripsOut').textContent = $('strips').value; render(); };
$('bw').onchange = render;
$('steps').onchange = () => document.body.classList.toggle('steps', $('steps').checked);
$('btnFlip').onclick = toggleFlip;
$('btnLoad').onclick = () => $('file').click();
$('sizes').onclick = e => { if (e.target.tagName === 'BUTTON') $('size').value = e.target.textContent; };
$('ptoggle').onclick = () => {
  const hidden = $('panel').classList.toggle('hidden');
  $('ptoggle').classList.toggle('hidden', hidden);
  $('stage').classList.toggle('wide', hidden);
  $('ptoggle').innerHTML = hidden ? '&lsaquo;' : '&rsaquo;';
};

$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  source = await createImageBitmap(f);
  sourceName = f.name;
  flip = false;
  render();
};

$('download').onclick = () => {
  if (!source) return;
  // Output long edge is about twice the source long edge (2x2 mirror), so scale the source to half the wanted size.
  const size = Math.min(4000, Math.max(200, +$('size').value || 1280)), fmt = $('fmt').value;
  const stages = build(size / 2), final = stages[stages.length - 1][1];
  final.toBlob(b => {
    const ext = { 'image/webp': 'webp', 'image/jpeg': 'jpg' }[b.type] || 'png'; // Safari cannot encode webp and hands back png
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `sliced-portrait-${Math.max(final.width, final.height)}px.${ext}`;
    a.click();
    URL.revokeObjectURL(a.href);
    $('status').textContent = `${final.width} x ${final.height} px · ${ext} · ${(b.size / 1048576).toFixed(1)} MB`;
  }, fmt, 0.92);
};

// Animation: the same stages, drawn strip by strip with interpolated position, angle and scale.
// Every stage is fitted into the 1000x1000 anim canvas, because width and height swap per pass.
const S = 1000;
const fit = (w, h) => { const s = S / Math.max(w, h); return { s, ox: (S - w * s) / 2, oy: (S - h * s) / 2 }; };
const ease = u => u < .5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
const clamp = u => Math.max(0, Math.min(1, u));
let anim = null; // { plan, t0, raf }

function planAnim() {
  const st = build(PREVIEW), n = +$('strips').value;
  const [orig, mirrored, p1] = st.map(x => x[1]);
  const stagger = Math.min(60, 1500 / n), dur = 700;
  const passPlan = (src, start) => {
    const sw = Math.floor(src.width / n), H = src.height;
    return { src, n, sw, H, order: stripOrder(n), from: fit(src.width, src.height), to: fit(H, sw * n),
             start, stagger, dur, end: start + (n - 1) * stagger + dur };
  };
  const p1Plan = passPlan(mirrored, 1300);
  const p2Plan = passPlan(p1, p1Plan.end + 400);
  return { mirrored, quad: { w: orig.width, h: orig.height }, p1: p1Plan, p2: p2Plan, end: p2Plan.end + 1200 };
}

function drawStrip(ctx, ps, r, u) {
  const i = ps.order[r], e = ease(u);
  const a = { x: ps.from.ox + ps.from.s * (i * ps.sw + ps.sw / 2), y: ps.from.oy + ps.from.s * ps.H / 2, s: ps.from.s };
  const b = { x: ps.to.ox + ps.to.s * ps.H / 2, y: ps.to.oy + ps.to.s * (r * ps.sw + ps.sw / 2), s: ps.to.s };
  ctx.save();
  ctx.translate(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e);
  ctx.rotate(e * Math.PI / 2);
  ctx.scale(a.s + (b.s - a.s) * e, a.s + (b.s - a.s) * e);
  ctx.drawImage(ps.src, i * ps.sw, 0, ps.sw, ps.H, -ps.sw / 2, -ps.H / 2, ps.sw, ps.H);
  ctx.restore();
}

function drawFrame(P, t) {
  const ctx = $('anim').getContext('2d');
  ctx.clearRect(0, 0, S, S);
  if (t < P.p1.start) {                      // mirror copies fade in, original top right
    const L = P.p1.from, { w, h } = P.quad;
    [[w, 0, 0], [0, 0, 100], [w, h, 400], [0, h, 700]].forEach(([qx, qy, at], k) => {
      ctx.globalAlpha = k === 0 ? 1 : clamp((t - at) / 400);
      ctx.drawImage(P.mirrored, qx, qy, w, h, L.ox + qx * L.s, L.oy + qy * L.s, w * L.s, h * L.s);
    });
    ctx.globalAlpha = 1;
  } else {                                   // strips fly: done ones below, then pending, moving ones on top
    const ps = t < P.p2.start ? P.p1 : P.p2;
    const u = r => clamp((t - ps.start - r * ps.stagger) / ps.dur);
    const rows = [...Array(ps.n).keys()];
    for (const r of rows) if (u(r) >= 1) drawStrip(ctx, ps, r, 1);
    for (const r of rows) if (u(r) <= 0) drawStrip(ctx, ps, r, 0);
    for (const r of rows) if (u(r) > 0 && u(r) < 1) drawStrip(ctx, ps, r, u(r));
  }
}

function stopAnim() {
  if (!anim) return;
  cancelAnimationFrame(anim.raf); anim = null;
  document.body.classList.remove('anim'); $('panel').classList.remove('busy');
  $('btnAnim').textContent = 'animate';
}
function startAnim() {
  if (!source) return;
  anim = { plan: planAnim(), t0: performance.now(), raf: 0 };
  document.body.classList.add('anim'); $('panel').classList.add('busy');
  $('btnAnim').textContent = 'stop';
  const tick = now => {
    let t = now - anim.t0;
    if (t >= anim.plan.end) { if ($('loop').checked) { anim.t0 = now; t = 0; } else return stopAnim(); }
    drawFrame(anim.plan, t);
    anim.raf = requestAnimationFrame(tick);
  };
  anim.raf = requestAnimationFrame(tick);
}
$('btnAnim').onclick = () => anim ? stopAnim() : startAnim();

// Default image. Needs an http server, file:// taints the canvas.
const img = new Image();
img.onload = () => { source = img; render(); };
img.src = 'warhol.jpg';
</script>
</body>
</html>
