<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolved Creatures: presets</title>
<style>
  /* Tokens aus DESIGN.md, dieselben Werte wie in index.html. */
  :root {
    --horizon: #D9EEFB;
    --floor-light: #FBF8F0;
    --floor-dark: #E2DACA;
    --surface: #FCFBF7;
    --rule: #E3DFD3;
    --ink: #26251F;
    --ink-2: #5E5B52;
    --node-0: #2a78d6;
    --node-1: #eb6834;
    --node-2: #1baf7a;
    --node-3: #eda100;
    --highlight: #e34948;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--rule); }
  h1 { margin: 0; font-size: 20px; }
  a { color: var(--ink); }
  header a { color: var(--ink-2); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(240px, 1fr); gap: 1px; background: var(--rule); }
  @media (max-width: 900px) { main { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { main { grid-template-columns: 1fr; } }
  figure { position: relative; margin: 0; min-width: 0; min-height: 0; overflow: hidden; background: var(--horizon); }
  canvas { display: block; width: 100%; height: 100%; }
  figcaption { position: absolute; left: 12px; top: 10px; padding: 4px 8px; border-radius: 3px; background: var(--surface); }
  figcaption b { display: block; font-size: 14px; }
  figcaption span { display: block; color: var(--ink-2); font: 12px var(--mono); white-space: nowrap; }
  .state::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--ink-2); vertical-align: 1px; }
  .state.training::before { background: var(--highlight); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js" } }
</script>
</head>
<body>
<header>
  <h1>Presets</h1>
  <a href="index.html">back to the simulation</a>
</header>
<main id="grid"></main>

<script type="module">
// Sechs Vorlagen, deren Körper von Hand gebaut ist und deren Gang scripts/train_presets.mjs sucht. Die Seite
// rechnet nichts: Das Skript schreibt presets/<key>.js mit dem Stand und der Bewegung des besten Läufers als
// Aufzeichnung, die Seite lädt die Dateien alle paar Sekunden als Skript nach (geht auch unter file://, anders
// als fetch) und spielt die Aufzeichnung in einer Schleife ab. Darum braucht sie weder MuJoCo noch den Kern.
import * as THREE from 'three';

const KEYS = ['quadruped', 'worm', 'spider', 'grasshopper', 'centipede', 'biped'];
const token = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NODE = [0, 1, 2, 3].map(i => new THREE.MeshStandardMaterial({ color: token('--node-' + i), roughness: 0.55 }));

// Schachboden wie in index.html: 2x2-Pixel-Textur, ein Feld ist 1 m.
const tile = document.createElement('canvas');
tile.width = tile.height = 2;
const tctx = tile.getContext('2d');
[[0, 0, '--floor-light'], [1, 1, '--floor-light'], [1, 0, '--floor-dark'], [0, 1, '--floor-dark']]
  .forEach(([x, y, n]) => { tctx.fillStyle = token(n); tctx.fillRect(x, y, 1, 1); });

const views = {};
for (const key of KEYS) {
  const fig = document.createElement('figure'), cap = document.createElement('figcaption');
  const name = document.createElement('b'), facts = document.createElement('span'), state = document.createElement('span');
  name.textContent = key[0].toUpperCase() + key.slice(1);
  state.className = 'state'; state.textContent = 'no training yet';
  cap.append(name, facts, state);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  fig.append(renderer.domElement, cap);
  document.getElementById('grid').append(fig);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(token('--horizon'));
  scene.fog = new THREE.Fog(token('--horizon'), 8, 40);
  scene.add(new THREE.HemisphereLight(0xffffff, token('--floor-dark'), 1.5));   // weiss, sonst färbt der Himmel den Boden blau
  const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 1, far: 20 });
  sun.shadow.bias = -0.0005;
  scene.add(sun, sun.target);
  const checker = new THREE.CanvasTexture(tile);
  checker.wrapS = checker.wrapT = THREE.RepeatWrapping;
  checker.repeat.set(200, 200);
  checker.magFilter = THREE.NearestFilter;
  checker.anisotropy = renderer.capabilities.getMaxAnisotropy();
  checker.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ map: checker }));
  floor.receiveShadow = true;
  scene.add(floor);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
  camera.up.set(0, 0, 1);
  const group = new THREE.Group();
  scene.add(group);
  new ResizeObserver(() => {
    renderer.setSize(fig.clientWidth, fig.clientHeight, false);
    camera.aspect = fig.clientWidth / fig.clientHeight;
    camera.updateProjectionMatrix();
  }).observe(fig);
  views[key] = { name, facts, state, renderer, scene, camera, sun, group, meshes: [], data: null, t: 0, eye: new THREE.Vector3() };
}

// Neuer Stand aus presets/<key>.js. Die Glieder werden nur neu gebaut, wenn ein anderer Läufer vorn liegt.
window.PRESET = d => {
  const v = views[d.key];
  if (!v || !Array.isArray(d.frames) || !Array.isArray(d.geoms)) return;
  v.name.textContent = d.name;
  v.facts.textContent = `${d.dist.toFixed(2)} m in 6 s · round ${d.rounds}`;
  v.state.textContent = d.done ? `trained for ${d.minutes} min` : `training, ${d.minutes} of ${d.of} min`;
  v.state.classList.toggle('training', !d.done);
  if (v.data && v.data.foundAt === d.foundAt && v.data.fit === d.fit) { v.data = { ...d, frames: v.data.frames }; return; }
  for (const m of v.meshes) { v.group.remove(m); m.geometry.dispose(); }
  v.meshes = d.geoms.map(({ t, s: [a, b, c], n }) => {
    // Typnummern aus MuJoCo: 2 Kugel, 3 Kapsel, 4 Ellipsoid, 5 Zylinder, 6 Quader. Kapsel und Zylinder liegen dort auf z.
    const geometry = t === 2 ? new THREE.SphereGeometry(a, 16, 12)
      : t === 4 ? new THREE.SphereGeometry(1, 16, 12).scale(a, b, c)
      : t === 3 ? new THREE.CapsuleGeometry(a, 2 * b, 6, 16).rotateX(Math.PI / 2)
      : t === 5 ? new THREE.CylinderGeometry(a, a, 2 * b, 16).rotateX(Math.PI / 2)
      : new THREE.BoxGeometry(2 * a, 2 * b, 2 * c);
    const mesh = new THREE.Mesh(geometry, NODE[n]);
    mesh.castShadow = true;
    v.group.add(mesh);
    return mesh;
  });
  v.group.rotation.z = -d.heading;   // Laufrichtung auf +x drehen, wie auf freier Fläche in index.html
  v.data = d;
  v.t = 0;
};

function poll() {
  for (const key of KEYS) {
    const s = document.createElement('script');
    s.src = `presets/${key}.js?${Date.now()}`;
    s.onload = s.onerror = () => s.remove();   // fehlt die Datei, bleibt die Kachel leer
    document.head.append(s);
  }
}
poll();
setInterval(poll, 4000);

const qa = new THREE.Quaternion(), qb = new THREE.Quaternion(), centre = new THREE.Vector3(), Z = new THREE.Vector3(0, 0, 1), HOLD = 0.6;
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  for (const v of Object.values(views)) {
    const d = v.data;
    if (d) {
      // Schleife: Aufzeichnung abspielen, am Ende kurz stehen bleiben, dann von vorn.
      const span = (d.frames.length - 1) / d.fps;
      v.t = (v.t + dt) % (span + HOLD);
      const f = Math.min(v.t, span) * d.fps, i = Math.min(Math.floor(f), d.frames.length - 2), u = f - i, A = d.frames[i], B = d.frames[i + 1];
      centre.set(0, 0, 0);
      v.meshes.forEach((m, k) => {
        const o = k * 7;
        m.position.set(A[o] + (B[o] - A[o]) * u, A[o + 1] + (B[o + 1] - A[o + 1]) * u, A[o + 2] + (B[o + 2] - A[o + 2]) * u);
        m.quaternion.slerpQuaternions(qa.fromArray(A, o + 3), qb.fromArray(B, o + 3), u);
        centre.add(m.position);
      });
      centre.divideScalar(v.meshes.length).applyAxisAngle(Z, v.group.rotation.z);
    } else centre.set(0, 0, 0.2);
    // Die Kamera steht schräg vor der Kreatur und läuft mit; nach dem Sprung an den Anfang springt sie mit.
    v.eye.set(centre.x + 0.9, centre.y - 1.7, 0.75);
    v.camera.position.copy(v.eye);
    v.camera.lookAt(centre.x, centre.y, 0.15);
    v.sun.position.set(centre.x + 4, centre.y - 5, 9);
    v.sun.target.position.set(centre.x, centre.y, 0);
    v.renderer.render(v.scene, v.camera);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
